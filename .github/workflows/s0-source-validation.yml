name: S0 source validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact head
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve pinned development dependencies without install scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run syntax and unit validation
        run: npm run validate

      - name: Enforce S0 provider boundary
        shell: bash
        run: |
          if grep -RInE 'chatgpt\.com|api\.openai\.com|openai\.com' src test-pages package.json; then
            echo 'Blocked provider target found in S0 runtime scope.' >&2
            exit 1
          fi
          echo 'Provider boundary scan: PASS'
