# Retrigger after excluding the carrier's own shell/tee children from residual detection.
# Non-merge carrier for Issue #18. Every validation step checks out immutable accepted main.
name: S0 latest-main immutable baseline carrier

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/s0-latest-main-release-baseline-carrier.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: ade022ed75e3c8c98df20a59f6ef38ff6c708466

jobs:
  exact-main-source:
    name: Exact-main source and stacked-tree audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact checkout and accepted stack
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          check_width() {
            local actual
            actual="$(git diff --name-only "$2..$3" | sort -u | wc -l | tr -d ' ')"
            printf '%s expected=%s actual=%s\n' "$1" "$4" "$actual"
            test "$actual" = "$4"
          }
          check_width '#2' 1c95fd9cd553aa10f915a5a14e9bdf2c9bac4002 f174e46fdd4264c2ce997ed24630834e492c35d0 31
          check_width '#3' f174e46fdd4264c2ce997ed24630834e492c35d0 369be52f0b211eb840cf98294f5a34d0bad91655 2
          check_width '#6' 369be52f0b211eb840cf98294f5a34d0bad91655 8122d0bd478fddea536dc9b49b9151de5e91e81c 5
          check_width '#7' 8122d0bd478fddea536dc9b49b9151de5e91e81c d959ee5b72af351ff8ba3903db4ef101f00f056c 5
          check_width '#5' d959ee5b72af351ff8ba3903db4ef101f00f056c 985bcd7ac959b9b3058b2c381928256f2a8d1638 1
          check_width '#9' 985bcd7ac959b9b3058b2c381928256f2a8d1638 ade022ed75e3c8c98df20a59f6ef38ff6c708466 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm run validate
      - name: Enforce provider boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RInE 'chatgpt\.com|api\.openai\.com|openai\.com' src test-pages package.json

  native-arm64-smoke:
    name: Native arm64 bounded Electron Chrome Chromium smoke
    needs: exact-main-source
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Initialize evidence and prove native arm64
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE="$RUNNER_TEMP/s0-latest-main-$BASELINE_SHA"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$EVIDENCE/head.txt"
          uname -m | tee "$EVIDENCE/uname.txt"
          node -p 'process.arch' | tee "$EVIDENCE/node-arch.txt"
          (/usr/sbin/sysctl -in sysctl.proc_translated || true) 2>&1 | tee "$EVIDENCE/rosetta.txt"
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(uname -m)" = arm64
          test "$(node -p 'process.arch')" = arm64
          test "$(tr -d '[:space:]' < "$EVIDENCE/rosetta.txt")" != 1
      - name: Prove installed Chrome architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          test -x "$CHROME" || brew install --cask google-chrome
          file "$CHROME" | tee "$EVIDENCE/chrome-file.txt"
          lipo -archs "$CHROME" | tee "$EVIDENCE/chrome-architectures.txt"
      - name: Install exact-main runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --no-package-lock --no-audit --no-fund 2>&1 | tee "$EVIDENCE/npm-install.log"
          npx playwright install chromium 2>&1 | tee "$EVIDENCE/playwright-install.log"
      - name: Validate exact main
        shell: bash
        run: npm run validate 2>&1 | tee "$EVIDENCE/validate.log"
      - name: Run bounded Electron IPC smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE/ipc"
          AI_EXE_OS_PROBE_OUTPUT="$EVIDENCE/ipc" npm run probe:ipc 2>&1 | tee "$EVIDENCE/ipc-smoke.log"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const r = JSON.parse(fs.readFileSync(path.join(process.env.EVIDENCE, 'ipc', 'probe-result.json'), 'utf8'));
          if (r.status !== 'PASS' || r.persistedEventCount < 1 || r.pageErrors.length !== 0) throw new Error(JSON.stringify(r));
          NODE
      - name: Run installed Chrome native architecture smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE/chrome-arch"
          AI_EXE_OS_CHROME_ARCH_OUTPUT="$EVIDENCE/chrome-arch" npm run probe:chrome-arch 2>&1 | tee "$EVIDENCE/chrome-arch.log"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const r = JSON.parse(fs.readFileSync(path.join(process.env.EVIDENCE, 'chrome-arch', 'chrome-architecture-result.json'), 'utf8'));
          const pass = r.attempts.some(a => a.launchKind === 'channel' && a.status === 'PASS' && a.processArch === 'arm64');
          if (r.status !== 'PASS' || r.hostArchitecture !== 'arm64' || !pass) throw new Error(JSON.stringify(r));
          NODE
      - name: Prove clean tracked tree and no scoped residual runtime process
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 5
          git status --short | tee "$EVIDENCE/git-status.txt"
          test ! -s "$EVIDENCE/git-status.txt"
          self="$$"
          ps -axo pid=,ppid=,command= > "$EVIDENCE/processes-after.txt"
          awk -v evidence="$EVIDENCE" -v self="$self" '
            $1 != self && $2 != self && index($0, evidence) &&
            $0 ~ /(Electron|Google Chrome|Chromium|chrome-headless-shell|node .*s0-)/ { print }
          ' "$EVIDENCE/processes-after.txt" > "$EVIDENCE/residual-scoped-processes.txt"
          if test -s "$EVIDENCE/residual-scoped-processes.txt"; then
            cat "$EVIDENCE/residual-scoped-processes.txt" >&2
            exit 1
          fi
          find "$EVIDENCE" -type f -print | sort > "$EVIDENCE/manifest.txt"
          find "$EVIDENCE" -type f ! -name SHA256SUMS.txt -exec shasum -a 256 {} \; | sort > "$EVIDENCE/SHA256SUMS.txt"
      - name: Upload immutable latest-main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0-latest-main-${{ env.BASELINE_SHA }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
