name: TrainingOS MCP live readiness v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/trainingos-mcp-live-readiness-v1.yml'

permissions:
  contents: read

jobs:
  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://gleaming-cajeta-c158d9.netlify.app/api/integrations/agents/mcp
      EXPECTED_PROTOCOL: '2025-11-25'

    steps:
      - name: Check out disposable carrier head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify public protected-resource metadata
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/trainingos-mcp-get.headers"
          body="$RUNNER_TEMP/trainingos-mcp-get.json"
          status="$({ curl \
            --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 20 \
            --proto '=https' --tlsv1.2 \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            "$TARGET_URL"; } 2>"$RUNNER_TEMP/trainingos-mcp-get.stderr")"
          test "$status" = "200"
          python3 - "$body" "$TARGET_URL" <<'PY'
          import json,sys,urllib.parse
          path,target=sys.argv[1:]
          payload=json.load(open(path,encoding='utf-8'))
          assert payload.get('resource') == target
          servers=payload.get('authorization_servers')
          assert isinstance(servers,list) and servers
          assert all(urllib.parse.urlparse(item).scheme == 'https' for item in servers)
          assert 'header' in payload.get('bearer_methods_supported',[])
          assert isinstance(payload.get('scopes_supported'),list) and payload['scopes_supported']
          profile=payload.get('trainingos_ide_oauth') or {}
          assert profile.get('pkce_required') is True
          assert profile.get('secret_storage_required') is True
          assert profile.get('bearer_in_redirect_forbidden') is True
          assert profile.get('agent_token_formal_writes_allowed') is False
          print('protected_resource_metadata=PASS')
          print('authorization_server_count=%d' % len(servers))
          print('scope_count=%d' % len(payload['scopes_supported']))
          PY

      - name: Verify unauthenticated initialize fails at OAuth boundary
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/trainingos-mcp-init.headers"
          body="$RUNNER_TEMP/trainingos-mcp-init.json"
          request="$RUNNER_TEMP/trainingos-mcp-init.request.json"
          python3 - "$request" "$EXPECTED_PROTOCOL" <<'PY'
          import json,sys
          path,protocol=sys.argv[1:]
          request={
            'jsonrpc':'2.0',
            'id':'live-readiness-1',
            'method':'initialize',
            'params':{
              'protocolVersion':protocol,
              'capabilities':{},
              'clientInfo':{'name':'ai-execution-os-live-readiness','version':'1.0.0'},
            },
          }
          open(path,'w',encoding='utf-8').write(json.dumps(request,separators=(',',':'))+'\n')
          PY
          status="$(curl \
            --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --proto '=https' --tlsv1.2 \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --header "mcp-protocol-version: $EXPECTED_PROTOCOL" \
            --data-binary "@$request" \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            "$TARGET_URL")"
          test "$status" = "401"
          python3 - "$headers" "$body" "$EXPECTED_PROTOCOL" <<'PY'
          import json,re,sys
          headers_path,body_path,expected_protocol=sys.argv[1:]
          raw=open(headers_path,encoding='utf-8',errors='replace').read()
          payload=json.load(open(body_path,encoding='utf-8'))
          error=payload.get('error') or {}
          data=error.get('data') or {}
          assert error.get('code') == -32001
          assert data.get('httpStatus') == 401
          assert re.search(r'(?im)^www-authenticate:\s*Bearer\b',raw)
          match=re.search(r'(?im)^mcp-protocol-version:\s*([^\r\n]+)',raw)
          assert match and match.group(1).strip() == expected_protocol
          print('unauthenticated_initialize_http=401')
          print('oauth_challenge=PASS')
          print('mcp_protocol_header=%s' % expected_protocol)
          PY

      - name: Emit sanitized live-readiness receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/trainingos-mcp-live-readiness.json" "$TARGET_URL" "$EXPECTED_PROTOCOL" <<'PY'
          import json,sys,datetime
          path,target,protocol=sys.argv[1:]
          receipt={
            'schemaVersion':'ai-execution-os.trainingos-mcp-live-readiness.v1',
            'target':target,
            'networkReachable':True,
            'tlsReachable':True,
            'protectedResourceMetadataVerified':True,
            'unauthenticatedInitializeRejected':True,
            'oauthChallengeVerified':True,
            'protocolHeader':protocol,
            'authenticatedDiscoveryPerformed':False,
            'requiredToolsObserved':False,
            'installationPerformed':False,
            'agentGrantPerformed':False,
            'toolInvocationPerformed':False,
            'canonicalWritePerformed':False,
            'productionMutationPerformed':False,
            'verdict':'AUTHENTICATED_DISCOVERY_REQUIRED',
            'collectedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
          }
          open(path,'w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Upload sanitized live-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: trainingos-mcp-live-readiness-v1
          path: ${{ runner.temp }}/trainingos-mcp-live-readiness.json
          if-no-files-found: error
          retention-days: 30
