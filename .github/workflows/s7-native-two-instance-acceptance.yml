name: S7 native two-instance collaboration acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-product-source:
    name: Exact frozen S7 product source validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S7_PRODUCT_SHA: 004bfc9f6972b0bfc0295256dcdb7aada308b70b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify QA-only carrier scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$S7_PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$S7_PRODUCT_SHA" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -vE '^(scripts/s7-acceptance-|\.github/workflows/s7-|docs/results/S7-results\.md$)' | grep -q .; then
            echo 'S7 acceptance carrier modified product-owned paths' >&2
            exit 1
          fi
      - name: Validate exact frozen product head
        shell: bash
        run: |
          set -euo pipefail
          git worktree add ../s7-product "$S7_PRODUCT_SHA"
          cd ../s7-product
          npm install --ignore-scripts --no-audit --no-fund
          npm run validate | tee ../ai_exe_os/s7-exact-source-validation.txt
      - name: Build source checksums
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$S7_PRODUCT_SHA" > exact-product-head.txt
          sha256sum exact-product-head.txt s7-exact-source-validation.txt > s7-source-SHA256SUMS.txt
          sha256sum -c s7-source-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: s7-exact-source-${{ github.sha }}
          path: |
            exact-product-head.txt
            s7-exact-source-validation.txt
            s7-source-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  native-arm64-two-instance:
    name: Native arm64 two-instance service + Electron acceptance
    runs-on: macos-26
    timeout-minutes: 45
    env:
      S7_PRODUCT_SHA: 004bfc9f6972b0bfc0295256dcdb7aada308b70b
      S7_ACCEPTANCE_OUTPUT: runtime/s7-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen source ancestry and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$S7_PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$S7_PRODUCT_SHA" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -vE '^(scripts/s7-acceptance-|\.github/workflows/s7-|docs/results/S7-results\.md$)' | grep -q .; then
            echo 'S7 acceptance carrier modified product-owned paths' >&2
            exit 1
          fi
      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(node -p 'process.arch')" = "arm64"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" != "1"
      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install chromium
          node -e "const fs=require('node:fs'); const electron=require('electron'); if(!fs.existsSync(electron)) throw new Error('Electron executable missing')"
          if [[ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]]; then
            brew install --cask google-chrome
          fi
      - name: Run full carrier/source validation on native arm64
        run: npm run validate
      - name: Prepare frozen-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$S7_ACCEPTANCE_OUTPUT"
          printf '%s\n' "$S7_PRODUCT_SHA" > "$S7_ACCEPTANCE_OUTPUT/exact-product-head.txt"
      - name: Run native SQLite / HTTP two-instance collaboration matrix
        run: node scripts/s7-acceptance-native-matrix.cjs
      - name: Run binding-aware real Electron two-instance collaboration matrix
        run: node scripts/s7-acceptance-electron-two-instance-v2.cjs
      - name: Verify S7 evidence and permanent authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          root="$S7_ACCEPTANCE_OUTPUT"
          for file in exact-product-head.txt native-two-instance-matrix.json native-two-instance-matrix.sha256 sync-negative-matrix.json electron-trace.jsonl electron-before-restart.json electron-after-restart.json electron-two-instance-audit.json electron-cleanup-audit.json s7-instance-a-after-sync.png s7-instance-b-after-sync.png s7-instance-a-after-restart.png s7-instance-b-after-restart.png; do
            test -s "$root/$file"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.S7_ACCEPTANCE_OUTPUT;
          const productSha = process.env.S7_PRODUCT_SHA;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const native = read('native-two-instance-matrix.json');
          const negative = read('sync-negative-matrix.json');
          const electron = read('electron-two-instance-audit.json');
          const before = read('electron-before-restart.json');
          const after = read('electron-after-restart.json');
          const cleanup = read('electron-cleanup-audit.json');
          for (const doc of [native, negative, electron, before, after, cleanup]) {
            if (doc.status !== 'PASS') throw new Error('S7 evidence document is not PASS');
            if ('productSha' in doc && doc.productSha !== productSha) throw new Error('S7 product SHA mismatch');
          }
          if (fs.readFileSync(path.join(root, 'exact-product-head.txt'), 'utf8').trim() !== productSha) throw new Error('exact product head mismatch');
          if (native.sourceA.id === native.sourceB.id || electron.sourceA === electron.sourceB) throw new Error('source identities are not independent');
          if (negative.conflict !== 'envelope_id_digest_conflict' || negative.gap !== 'cursor_gap' || negative.crossWorkspace !== 'cross_workspace' || negative.unknownSource !== 'unknown_source') throw new Error('fail-closed matrix mismatch');
          if (after.replayA.networkRequested !== false || after.replayB.networkRequested !== false) throw new Error('acknowledged envelope replayed after restart');
          if (before.sourceA !== after.sourceA || before.sourceB !== after.sourceB) throw new Error('source identity drift after restart');
          if (before.cursorA.lastProducedCursor !== after.cursorA.lastProducedCursor || before.cursorA.lastAcknowledgedCursor !== after.cursorA.lastAcknowledgedCursor) throw new Error('A cursor drift after restart');
          if (before.cursorB.lastProducedCursor !== after.cursorB.lastProducedCursor || before.cursorB.lastAcknowledgedCursor !== after.cursorB.lastAcknowledgedCursor) throw new Error('B cursor drift after restart');
          if (electron.pageErrors.length || electron.consoleErrors.length) throw new Error('Electron page/console errors present');
          if (cleanup.residualScopedProcesses.length) throw new Error('residual scoped process present');
          if (!native.requestAudit.every((item) => ['GET','POST'].includes(item.method) && !item.hasAuthorization && !item.hasCookie)) throw new Error('native transport request boundary violated');
          if (!electron.mirrorRequestAudit.every((item) => ['GET','POST'].includes(item.method) && !item.hasAuthorization && !item.hasCookie)) throw new Error('Electron transport request boundary violated');
          const chromeA = electron.workerPresenceFromA.find((item) => item.workerPublicId === 's1-worker-chrome');
          const chromiumB = electron.workerPresenceFromB.find((item) => item.workerPublicId === 's1-worker-chromium');
          if (chromeA?.statusClass !== 'available' || chromiumB?.statusClass !== 'available') throw new Error('canonical WorkerBinding presence mismatch');

          const forbiddenKey = /^(authorization|proxy-authorization|cookie|cookies|set-cookie|password|passwd|access[_-]?token|refresh[_-]?token|id[_-]?token|token|secret|private[_ -]?key|profilePath|profileDir|profileDirectory|browserProfile|userData|userDataDir|storageState|processId|pid|ppid|body|responseBody|environment|env|debugEndpoint|controlHandle)$/i;
          const forbiddenString = /(-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|\bBearer\s+[A-Za-z0-9._~+/=-]{12,}|\b(?:sessionid|access_token|refresh_token|id_token)=|\/private\/)/i;
          function scan(value, trail = '$') {
            if (value == null) return;
            if (typeof value === 'string') {
              if (forbiddenString.test(value)) throw new Error(`sensitive string at ${trail}`);
              return;
            }
            if (Array.isArray(value)) return value.forEach((item, index) => scan(item, `${trail}[${index}]`));
            if (typeof value === 'object') for (const [key, nested] of Object.entries(value)) {
              if (forbiddenKey.test(key)) throw new Error(`forbidden evidence key ${trail}.${key}`);
              scan(nested, `${trail}.${key}`);
            }
          }
          for (const file of fs.readdirSync(root).filter((name) => name.endsWith('.json'))) scan(read(file), file);
          NODE
          if grep -RInE 'workerManager\.start\s*\(|submitAuthorizedLocalTask\s*\(|approveHumanGate\s*\(|rejectHumanGate\s*\(|retryStepAfterReview\s*\(|locks\.(acquire|release)\s*\(' src/application/s7-*.cjs; then
            echo 'S7 contains forbidden direct local execution authority' >&2; exit 1
          fi
          if grep -RInE 's7:sync:(start|stop|focus|pause|resume|execute|approve|reject|retry|provider|deploy|promote|rollback|mutate)' src/preload/index.cjs src/application/s7-ipc.cjs src/renderer/s7-integrated.js; then
            echo 'Unexpected S7 remote execution-authority IPC/control path' >&2; exit 1
          fi
          if grep -RInE 'innerHTML\s*=|outerHTML\s*=|insertAdjacentHTML|document\.write' src/renderer/s7-integrated.js src/renderer/s7/*.cjs; then
            echo 'Unsafe S7 mirror HTML rendering path' >&2; exit 1
          fi
      - name: Build portable manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$S7_ACCEPTANCE_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('.').filter((name) => name !== 'manifest.json' && name !== 'SHA256SUMS.txt').sort();
          fs.writeFileSync('manifest.json', JSON.stringify({ status: 'PASS', productSha: process.env.S7_PRODUCT_SHA, evidenceClass: 'github-hosted-native-apple-silicon-two-instance-collaboration', files }, null, 2) + '\n');
          NODE
          rm -f SHA256SUMS.txt
          for file in $(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print | sed 's#^./##' | LC_ALL=C sort); do shasum -a 256 "$file"; done > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Upload privacy-safe immutable S7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s7-native-two-instance-${{ github.sha }}
          path: runtime/s7-acceptance
          if-no-files-found: error
          retention-days: 30
