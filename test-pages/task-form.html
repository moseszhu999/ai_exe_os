<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Execution OS local test surface</title>
  <style>
    body{font-family:system-ui;background:#f4f7fb;color:#142033;margin:0;padding:40px}
    main{max-width:720px;margin:auto;background:white;border:1px solid #ccd7e3;border-radius:16px;padding:24px}
    textarea,button{width:100%;padding:12px;margin-top:10px}
    #result{margin-top:18px;padding:14px;background:#eaf5ff;border-radius:10px;white-space:pre-wrap}
  </style>
</head>
<body>
<main>
  <h1>Project-owned S0 test page</h1>
  <p>This page is local and deterministic. It is not a third-party AI provider.</p>
  <textarea id="task-input" aria-label="Task payload"></textarea>
  <button id="submit-task">Submit authorized local task</button>
  <div id="result" data-ready="false">Waiting for an authorized local task.</div>
</main>
<script>
  document.getElementById('submit-task').addEventListener('click', () => {
    const rawValue = document.getElementById('task-input').value;
    const delayed = /^S0_DELAY_MS=(\d{1,5})\n([\s\S]*)$/.exec(rawValue);
    const delayMs = delayed ? Math.min(Number(delayed[1]), 15000) : 0;
    const value = delayed ? delayed[2] : rawValue;
    const result = document.getElementById('result');
    const previous = localStorage.getItem('last-authorized-local-task') || '<none>';

    result.dataset.ready = 'false';
    result.textContent = delayMs > 0
      ? `LOCAL_TEST_PENDING\ndelayMs=${delayMs}`
      : 'LOCAL_TEST_PROCESSING';

    const finish = () => {
      result.textContent = `LOCAL_TEST_ACCEPTED\nlength=${value.length}\nvalue=${value}\nprevious=${previous}`;
      result.dataset.ready = 'true';
      localStorage.setItem('last-authorized-local-task', value);
    };

    if (delayMs > 0) setTimeout(finish, delayMs);
    else finish();
  });
</script>
</body>
</html>
